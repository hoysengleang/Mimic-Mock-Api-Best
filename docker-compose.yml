

services:
  mimic-api:
    build:
      context: ./src/Mimic.API
      target: dev
    container_name: mimic_api
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - ./src/Mimic.API/app:/app/app
      - mimic-data:/app/data
    environment:
      APP_NAME: ${APP_NAME:-Mimic}
      API_PREFIX: ${API_PREFIX:-/api}
      DATA_DIR: /app/data
      DEBUG: ${DEBUG:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ALLOW_PRIVATE_NETWORK: ${ALLOW_PRIVATE_NETWORK:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mimic-ui:
    build:
      context: ./src/Mimic.UI
      target: dev
    container_name: mimic_ui
    ports:
      - "${UI_PORT:-3000}:5173"
    volumes:
      - ./src/Mimic.UI/src:/app/src
      - ./src/Mimic.UI/index.html:/app/index.html
      - ./src/Mimic.UI/vite.config.ts:/app/vite.config.ts
    environment:
      # Inside the compose network the API is reachable by service name.
      VITE_PROXY_TARGET: http://mimic-api:8080
    depends_on:
      mimic-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mimic-data:
