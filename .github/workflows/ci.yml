name: CI

on:
  push:
    branches: [main, BRANCH-BASE-CODE-WORK]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Mimic.API

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/Mimic.API/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Mimic.UI

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      - name: Type check
        run: yarn typecheck

      - name: Build
        run: yarn vite build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/Mimic.API/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend
        working-directory: src/Mimic.API
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: src/Mimic.API
        env:
          DATA_DIR: ./data
          SEED_DEMO_DATA: 'true'
          RATE_LIMIT_ENABLED: 'false'
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 5000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/api/health && break
            sleep 1
          done

      - name: Install frontend
        working-directory: src/Mimic.UI
        run: corepack enable && yarn install --immutable

      - name: Install Playwright browser
        working-directory: src/Mimic.UI
        run: yarn playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: src/Mimic.UI
        run: yarn playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/Mimic.UI/playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t mimic-api:ci src/Mimic.API
          docker build -t mimic-ui:ci src/Mimic.UI
