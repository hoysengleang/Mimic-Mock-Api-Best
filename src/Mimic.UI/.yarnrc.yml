# Use the classic node_modules layout rather than Yarn's Plug'n'Play.
#
# PnP is faster and stricter, but it requires editor and tooling support that
# not everyone running this project will have, and it interacts badly with the
# bind-mounted volume the Docker dev setup uses. A predictable node_modules
# tree is worth more here than the install speed.
nodeLinker: node-modules

enableTelemetry: false
