upstream mimic_api {
    server mimic-api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded request bodies can be large; match the API's own limit.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The management API.
    location /api/ {
        proxy_pass http://mimic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A looped run can take a while; do not cut it off.
        proxy_read_timeout 300s;
    }

    # The mock responder. Anchored with a trailing slash so it cannot also
    # capture the UI's own /mocks route.
    location /mock/ {
        proxy_pass http://mimic_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /docs { proxy_pass http://mimic_api; }
    location = /openapi.json { proxy_pass http://mimic_api; }

    # Everything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
